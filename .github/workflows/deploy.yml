name: Deploy to production

on:
  push:
    branches: [main]

# Prevent two deploys from overlapping on the same Amplify branch.
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  id-token: write # required for AWS OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Build
        run: npx next build

      - name: Sync database schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma db push

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Trigger Amplify deploy
        run: |
          JOB_ID=$(aws amplify start-job \
            --app-id "${{ secrets.AWS_AMPLIFY_APP_ID }}" \
            --branch-name main \
            --job-type RELEASE \
            --query 'jobSummary.jobId' \
            --output text)
          echo "Started Amplify job $JOB_ID"

          STATUS="PENDING"
          while [[ "$STATUS" == "PENDING" || "$STATUS" == "RUNNING" ]]; do
            sleep 15
            STATUS=$(aws amplify get-job \
              --app-id "${{ secrets.AWS_AMPLIFY_APP_ID }}" \
              --branch-name main \
              --job-id "$JOB_ID" \
              --query 'job.summary.status' \
              --output text)
            echo "Amplify job $JOB_ID status: $STATUS"
          done

          if [[ "$STATUS" != "SUCCEED" ]]; then
            echo "Amplify deploy failed with status $STATUS"
            exit 1
          fi
