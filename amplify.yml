version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        # Keeps the production schema in sync with prisma/schema.prisma on
        # every deploy. DATABASE_URL is set as an Amplify environment
        # variable (Console → app → Hosting → Environment variables) —
        # see DEPLOYMENT.md. It's a no-op once the schema already matches.
        # Deliberately WITHOUT --accept-data-loss: a schema change that
        # would drop data fails the build instead of silently deleting
        # anything — run `prisma db push --accept-data-loss` by hand
        # against DATABASE_URL when you actually intend that.
        - npx prisma db push
    build:
      commands:
        # Amplify's Console-configured env vars reach this build shell (that's
        # why the `prisma db push` above works) but not the deployed SSR
        # Lambda's own runtime process.env — confirmed by a live diagnostic
        # that logged both as undefined at request time. Writing them to
        # .env.production.local here means Next.js's own env loader picks
        # them up at Lambda cold start instead: purely server-side, loaded
        # from a plain file, never inlined into any JS bundle a browser could
        # ever receive.
        - printf 'AUTH_SECRET=%s\nDATABASE_URL=%s\n' "$AUTH_SECRET" "$DATABASE_URL" > .env.production.local
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
