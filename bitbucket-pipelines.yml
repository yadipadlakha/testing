image: atlassian/default-image:4

definitions:
  caches:
    uv: ~/.cache/uv
    npm: ~/.npm

  services:
    postgres:
      image: postgres:16-alpine
      variables:
        POSTGRES_USER: travel
        POSTGRES_PASSWORD: travel
        POSTGRES_DB: travel_dmc_test

  steps:
    - step: &api-lint-and-test
        name: apps/api — lint, types, tests
        image: python:3.11-slim
        caches:
          - uv
        services:
          - postgres
        script:
          - cd apps/api
          - pip install --no-cache-dir uv
          - uv venv .venv
          - uv pip install -e . --group dev -p .venv/bin/python
          - .venv/bin/ruff check .
          - .venv/bin/ruff format --check .
          - .venv/bin/mypy app
          - export DATABASE_URL="postgresql+psycopg://travel:travel@localhost:5432/travel_dmc_test"
          - export JWT_SECRET_KEY="ci-test-secret"
          - export ENVIRONMENT="test"
          - .venv/bin/pytest --cov=app --cov-report=term-missing --cov-report=xml
        artifacts:
          - apps/api/coverage.xml

    - step: &web-lint-and-build
        name: apps/web — lint, types, build
        image: node:22-slim
        caches:
          - npm
        script:
          - cd apps/web
          - npm ci
          - npm run lint
          - npx tsc --noEmit
          - npx prisma generate
          # next build imports server modules (Prisma client, NextAuth config) while
          # collecting page data, so these must be set even though nothing connects
          # to a real database or issues a session during the build itself.
          - export DATABASE_URL="postgresql://travel:travel@localhost:5432/travel_crm"
          - export AUTH_SECRET="ci-build-secret"
          - npm run build

pipelines:
  default:
    - parallel:
        - step: *api-lint-and-test
        - step: *web-lint-and-build

  pull-requests:
    "**":
      - parallel:
          - step: *api-lint-and-test
          - step: *web-lint-and-build

  branches:
    main:
      - parallel:
          - step: *api-lint-and-test
          - step: *web-lint-and-build
      # Playwright E2E runs separately (slower, full-stack) per
      # docs/TESTING_STRATEGY.md §5 — added once apps/web/e2e exists.
