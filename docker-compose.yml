services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: travel
      POSTGRES_PASSWORD: travel
      POSTGRES_DB: travel_dmc
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./infra/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel -d travel_dmc"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./apps/api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://travel:travel@db:5432/travel_dmc
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-me}
      ENVIRONMENT: development
      CORS_ALLOW_ORIGINS: '["http://localhost:3000"]'
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  web:
    # Targets the "builder" stage (full node_modules, incl. the Prisma CLI) rather
    # than the final lean "runner" stage, so this one container can migrate its own
    # database and seed demo data before serving — convenient for local dev via
    # `docker compose up`. A real deployment runs migrations as their own step and
    # ships the lean `runner` stage (see apps/web/Dockerfile) instead.
    build:
      context: ./apps/web
      target: builder
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      # Legacy MVP still owns its own DB/auth (see docs/IMPLEMENTATION_ROADMAP.md) —
      # this connects it to the same Postgres instance under its own database.
      DATABASE_URL: postgresql://travel:travel@db:5432/travel_crm
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-me}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    command: >
      sh -c "npx prisma db push && npx tsx prisma/seed.ts && npm run start"

volumes:
  db_data:
